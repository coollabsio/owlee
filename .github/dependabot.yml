version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]
    ignore:
      # Major versions need their own change and testing; do them by hand.
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  # Dependabot's bun support reads apps/web/bun.lock.
  - package-ecosystem: bun
    directory: /apps/web
    schedule:
      interval: weekly
    groups:
      web:
        update-types: [minor, patch]
    ignore:
      # Major versions need their own change and testing; do them by hand.
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # The CI toolchain follows rust-toolchain.toml. Bump both together.
      - dependency-name: dtolnay/rust-toolchain

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The rust image follows rust-toolchain.toml. Bump both together.
      - dependency-name: rust
