name: ci

on:
  push:
  pull_request:
  # release.yml and image.yml run these jobs before they publish.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: status
          POSTGRES_PASSWORD: status
          POSTGRES_DB: status
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U status -d status"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      OWLEE_TEST_POSTGRES_URL: postgres://status:status@127.0.0.1:5432/status_platform
      OWLEE_APP_POSTGRES_URL: postgres://status:status@127.0.0.1:5432/status_app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: rustfmt
      - uses: oven-sh/setup-bun@v2
      - name: Create test databases
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          PGPASSWORD=status psql -h 127.0.0.1 -U status -d status -c "CREATE DATABASE status_platform"
          PGPASSWORD=status psql -h 127.0.0.1 -U status -d status -c "CREATE DATABASE status_app"
      - name: Backend tests
        run: cargo test --workspace
      - name: Frontend build
        run: cd apps/web && bun install --frozen-lockfile && bun run build

  musl:
    name: musl release build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          targets: x86_64-unknown-linux-musl
      - name: Build static binary
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          cargo build --locked --release -p owlee-server --target x86_64-unknown-linux-musl
      - name: Smoke-run the binary
        run: target/x86_64-unknown-linux-musl/release/owlee --version

