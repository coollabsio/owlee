name: Release binaries

# Push a tag like v0.1.0 to publish static Linux binaries. The agent setup in
# the dashboard downloads them from releases/latest/download/owlee-<arch>-linux.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml

  build:
    name: build (${{ matrix.arch }})
    needs: ci
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Build UI
        working-directory: apps/web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build static binary
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add ${{ matrix.arch }}-unknown-linux-musl
          cargo build --locked --release -p owlee-server --target ${{ matrix.arch }}-unknown-linux-musl
          cp target/${{ matrix.arch }}-unknown-linux-musl/release/owlee owlee-${{ matrix.arch }}-linux
          strip owlee-${{ matrix.arch }}-linux

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: owlee-${{ matrix.arch }}-linux
          path: owlee-${{ matrix.arch }}-linux

  release:
    name: publish release
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A tag with a suffix (v0.1.0-rc.1) is a pre-release, so releases/latest,
        # which the agent download uses, keeps pointing at the newest stable release.
        run: |
          flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --generate-notes "${flags[@]}"
