services:
  owlee:
    build:
      context: ..
    image: ${OWLEE_IMAGE:-owlee:local}
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      OWLEE_ENV: production
      OWLEE_BIND: 0.0.0.0
      OWLEE_PORT: 8080
      # Encrypts secrets saved in the database, such as the SMTP password.
      # Make one with `openssl rand -base64 32` and keep it: a new key makes
      # the saved SMTP password unreadable, and the root user must enter it again.
      OWLEE_APP_KEY: ${OWLEE_APP_KEY:?Set OWLEE_APP_KEY}
      # Coolify publishes this container through Traefik, which appends one
      # X-Forwarded-For hop. Per-IP limits (ingest and login) read that hop.
      # Use 2 when Cloudflare sits in front of Traefik.
      OWLEE_PROXY_HOPS: ${OWLEE_PROXY_HOPS:-1}
      # X-Forwarded-For is read only from these peers. The default is loopback
      # and private networks, where the Traefik container lives, so a client
      # that reaches the published port directly cannot fake its address.
      # OWLEE_TRUSTED_PROXIES: 10.0.1.0/24
      # The URL people open, such as https://status.example.com. Sign-in accepts
      # changes only from this origin, the session cookie is Secure when it is
      # https, and the one-time Initial setup URL uses it.
      OWLEE_PUBLIC_ORIGIN: ${OWLEE_PUBLIC_ORIGIN:?Set OWLEE_PUBLIC_ORIGIN to the URL people open, such as https://status.example.com}
      # SQLite file inside the volume. Set this to another path to use a different file.
      OWLEE_DATABASE_PATH: /var/lib/owlee/owlee.sqlite
      # Public sign-up stays closed after the owner is created from that URL.
      # The root user opens it in Settings after SMTP is configured.
      # Switch the same binary to Postgres by setting this and starting the db service.
      # OWLEE_DB_PASSWORD comes from the environment. Do not commit a password.
      # OWLEE_DATABASE_URL: postgres://owlee:${OWLEE_DB_PASSWORD}@db:5432/owlee
    volumes:
      - owlee-data:/var/lib/owlee
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: owlee
  #     POSTGRES_PASSWORD: ${OWLEE_DB_PASSWORD}
  #     POSTGRES_DB: owlee
  #   volumes:
  #     - owlee-pg:/var/lib/postgresql/data
volumes:
  owlee-data:
