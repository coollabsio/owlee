[package]
name = "owlee-server"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "owlee_server"
path = "src/lib.rs"

[[bin]]
name = "owlee"
path = "src/main.rs"

[dependencies]
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
base64.workspace = true
chacha20poly1305 = "0.10"
chrono.workspace = true
flate2.workspace = true
hex.workspace = true
clap = { version = "4", features = ["derive", "env"] }
owlee-domain = { path = "../../crates/status" }
owlee-errors = { path = "../../crates/errors" }
owlee-insights = { path = "../../crates/insights" }
owlee-platform = { path = "../../crates/platform" }
isbot = "0.1.3"
maxminddb = "0.33.0"
http-body-util = "0.1"
include_dir = "0.7"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
mime_guess = "2"
rand.workspace = true
uuid.workspace = true
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["mysql"] }
thiserror.workspace = true
time = { version = "0.3", default-features = false }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["timeout", "trace"] }
tracing.workspace = true
toml = "1.1.8"

[dev-dependencies]
futures-util = "0.3"
owlee-platform = { path = "../../crates/platform" }
sqlx = { workspace = true }
http-body-util = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1.52"
