# cargo deny check: RustSec advisories, licenses, duplicate versions, sources.
# Run locally with `cargo deny check`. CI runs the same command.

[graph]
# The release binaries are static musl builds; the image is glibc. Check both.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]
all-features = true

[advisories]
# Unmaintained crates are reported for the whole tree; only fail on those
# this workspace depends on directly.
unmaintained = "workspace"
ignore = [
    # rsa (via sqlx-mysql, for MySQL monitors). Marvin recovers a private key
    # from decryption timing. sqlx only encrypts the password with the MySQL
    # server's public key, and no fixed rsa release exists.
    { id = "RUSTSEC-2023-0071", reason = "sqlx-mysql uses rsa public-key encryption only; no fix released" },
    # libsqlite3-sys 0.30 bundles SQLite < 3.54. The fix needs sqlx 0.9. The
    # attack needs crafted database and -wal files in Owlee's data directory,
    # and whoever can write there already controls the data.
    { id = "RUSTSEC-2026-0459", reason = "needs local write access to the data directory; fixed by the sqlx 0.9 upgrade" },
    # chrono is unmaintained with no successor release. Replacing it is its own change.
    { id = "RUSTSEC-2026-0543", reason = "unmaintained, no known vulnerability; replace chrono separately" },
]

[licenses]
# Permissive licenses that can ship inside an Apache-2.0 binary.
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# Workspace crates are not published to crates.io.
ignore = true

[bans]
multiple-versions = "warn"
# Path dependencies between workspace crates carry no version, and the crates
# are not marked publish = false, so cargo-deny counts them as wildcards.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
